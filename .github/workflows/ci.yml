name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # la release pasa estos mismos checks antes de publicar
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Todos los jobs van en paralelo: el más largo marca lo que tarda el CI.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go, node y pnpm salen de mise.toml: las mismas versiones que en local
      - uses: jdx/mise-action@v2
      # golangci-lint typa todo el proyecto: sin la caché de Go son dos minutos más
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-
      # frontend/embed.go incrusta dist/: sin build del frontend basta un index vacío para compilar
      - run: mkdir -p frontend/dist && touch frontend/dist/index.html
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.0
      # ningún nombre de upstream fuera de las excepciones (módulo Go, cabeceras AGPL, LICENSE)
      - run: go tool mage check:branding
      - run: go tool mage check:translations

  feature-tests:
    name: Tests Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-feature-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-feature-${{ runner.os }}-
      - run: go tool mage test:feature

  web-tests:
    name: Tests web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-web-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-web-${{ runner.os }}-
      - run: go tool mage test:web

  frontend-lint:
    name: Lint frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:styles
      - run: pnpm typecheck

  frontend-tests:
    name: Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run --dir ./src
      - run: pnpm build

  image:
    name: Imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/binary
      # la imagen solo empaqueta el binario, así que esto tarda segundos
      - run: docker build .
