name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go, node y pnpm salen de mise.toml: las mismas versiones que en local
      - uses: jdx/mise-action@v2
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13.0
      # ningún nombre de upstream fuera de las excepciones (módulo Go, cabeceras AGPL, LICENSE)
      - run: go tool mage check:branding
      - run: go tool mage check:translations
      - run: go tool mage test:feature
      - run: go tool mage test:web

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:styles
      - run: pnpm typecheck
      - run: pnpm vitest run --dir ./src
      - run: pnpm build

  docker:
    name: Imagen
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
