name: Release

# Publica la imagen multi-arch en GHCR. Dos vías:
#  · manual: Actions → Release → "Run workflow" (elige versión)
#  · automática: al empujar una tag vX.Y.Z
#
# Los checks y la construcción de la imagen van a la vez; los tags solo se mueven
# cuando los dos terminan bien.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la imagen (ej. 0.2.0). Vacío = tag actual sin la v"
        required: false
        type: string
      latest:
        description: "Mover también el tag :latest"
        type: boolean
        default: true
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# dos releases de la misma ref a la vez se pisarían los tags
concurrency:
  group: release-${{ github.ref }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  build:
    name: Imagen ${{ matrix.arch }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    # cada arquitectura en un runner suyo: nada se compila cruzado ni emulado
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolver versión
        id: meta
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "::error::Sin 'version' de entrada solo se puede lanzar desde una tag (ref actual: $GITHUB_REF_NAME)"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/binary
        with:
          version: ${{ steps.meta.outputs.version }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se sube sin tag, solo por digest: los tags los mueve el job publish cuando
      # los checks han pasado. Sin attestations, que convierten cada arquitectura en
      # un índice y estorban al juntarlas.
      - name: Subir la imagen por digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          provenance: false
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Guardar el digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tags en GHCR
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Juntar las arquitecturas bajo los tags
        id: meta
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.build.outputs.version }}
          LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail
          tags="$IMAGE:$VERSION"
          # en un push de tag inputs.latest viene vacío: latest se mueve igual
          if [ "$LATEST" != "false" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          docker buildx imagetools create \
            $(echo "$tags" | tr ',' '\n' | sed 's/^/-t /') \
            $(printf "$IMAGE@sha256:%s " *)
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Resumen
        run: |
          {
            echo "### Publicado"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
            echo '```'
            echo "Plataformas: \`linux/amd64, linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
